<VirtualHost *:80>
	DocumentRoot /var/www/html/public_html

	<Directory /var/www/html/public_html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog /dev/stderr
	SetEnvIf User-Agent "^health$" healthcheck
	CustomLog /dev/stdout combined "expr=!(reqenv('healthcheck') == '1' && (-R '127.0.0.1/8' || -R '::1'))"
</VirtualHost>
